<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>BLAUWDRUK</title>
<meta name="description" content="Begin je eigen engineeringbureau: jij ontwerpt, je vakmensen bouwen.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@700&family=Source+Sans+3:wght@400;600;700;800&display=swap">
<style>
:root{--indigo:#20116e;--blue:#1164b3;--mint:#47d7ad;--teal:#138273;--orange:#ff8f1a;--fuchsia:#f391c8;--fuchsia-d:#c02a86;--red:#dd1c50;--yel:#ffc915;--lav:#9678dc;
  --bg:#f4f3fb;--card:#fff;--ink:#20116e;--mut:#6b6790;--line:#e3e1f2;--serif:'Zilla Slab',Georgia,serif;--sans:'Source Sans 3','Segoe UI',system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:var(--sans);background:var(--indigo);color:var(--ink);overflow:hidden;touch-action:manipulation;user-select:none;-webkit-user-select:none}
button{font-family:inherit;cursor:pointer}
#app{max-width:520px;margin:0 auto;height:100dvh;background:var(--bg);display:flex;flex-direction:column;position:relative;box-shadow:0 0 60px rgba(0,0,0,.35)}
/* HUD */
#hud{flex:none;background:var(--indigo);color:#fff;padding:10px 14px 8px;display:flex;align-items:center;gap:10px;position:relative;z-index:5}
#hud:after{content:"";position:absolute;left:0;right:0;bottom:-4px;height:4px;background:linear-gradient(90deg,var(--blue),var(--mint) 60%,var(--fuchsia))}
#hud .logo{font-family:var(--serif);font-weight:700;font-size:1.05rem;letter-spacing:.04em;line-height:1}
#hud .logo small{display:block;font-family:var(--sans);font-size:.6rem;letter-spacing:.2em;text-transform:uppercase;opacity:.7;font-weight:800;margin-top:2px}
#hud .money{margin-left:auto;font-weight:800;font-size:1.15rem;font-variant-numeric:tabular-nums;background:rgba(255,255,255,.12);padding:4px 12px;border-radius:99px}
#hud .money.bump{animation:bump .4s}
@keyframes bump{40%{transform:scale(1.15);background:var(--mint);color:var(--indigo)}}
#hud .rep{flex:1;min-width:0;max-width:180px}
#hud .rep b{display:block;font-size:.68rem;letter-spacing:.02em;text-transform:uppercase;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hud .rep i{display:block;height:6px;background:rgba(255,255,255,.18);border-radius:9px;margin-top:3px;overflow:hidden}
#hud .rep i:after{content:"";display:block;height:100%;width:var(--p,0%);background:linear-gradient(90deg,var(--yel),var(--fuchsia));transition:width .5s}
#hud .menu{background:transparent;border:2px solid rgba(255,255,255,.35);color:#fff;border-radius:50%;width:32px;height:32px;font-size:1rem;line-height:1;flex:none}
#hud .money{margin-left:auto}
#hud .reset{font-size:1.1rem}
/* main scroll */
#main{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding-bottom:84px;scroll-behavior:smooth}
.tab{display:none;padding:12px 12px 0}
.tab.on{display:block;animation:fade .25s}
@keyframes fade{from{opacity:0;transform:translateY(6px)}}
h2.sec{font-family:var(--serif);font-size:1.15rem;margin:16px 2px 8px;display:flex;align-items:center;gap:8px}
h2.sec small{font-family:var(--sans);font-weight:800;font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;color:#fff;background:var(--indigo);padding:3px 8px;border-radius:99px}
h2.sec .r{margin-left:auto;font-family:var(--sans);font-size:.78rem;color:var(--mut);font-weight:600}
/* scene */
#scene{background:linear-gradient(#dcefff,#f4f3fb 70%);border-radius:18px;overflow:hidden;border:1px solid var(--line);position:relative}
#scene svg{display:block;width:100%;height:auto}
.worker .arm{transform-origin:0 0;}
.worker.busy .arm{animation:hammer .5s infinite alternate ease-in-out}
@keyframes hammer{from{transform:rotate(-25deg)}to{transform:rotate(20deg)}}
.worker.busy .spark{animation:spark .35s infinite}
@keyframes spark{0%{opacity:1;transform:scale(.4)}100%{opacity:0;transform:scale(1.6)}}
.worker.idle .zz{animation:zz 1.8s infinite}
@keyframes zz{0%{opacity:0;transform:translateY(0)}30%{opacity:1}100%{opacity:0;transform:translateY(-8px)}}
.printerhead{animation:ph 1.6s infinite alternate ease-in-out}
@keyframes ph{from{transform:translateX(0)}to{transform:translateX(22px)}}
.gear{transform-box:fill-box;transform-origin:center;animation:spin 4s linear infinite}
.gear.rev{animation-direction:reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.blink{animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.2}}
.flow{stroke-dasharray:6 6;animation:flow 1s linear infinite}
@keyframes flow{to{stroke-dashoffset:-12}}
.cloud{animation:cloud 40s linear infinite}
@keyframes cloud{from{transform:translateX(-80px)}to{transform:translateX(420px)}}
.sun{transform-box:fill-box;transform-origin:center;animation:spin 40s linear infinite}
#scene .hint{position:absolute;left:10px;right:10px;bottom:10px;background:rgba(32,17,110,.92);color:#fff;font-size:.82rem;padding:8px 12px;border-radius:12px;text-align:center;font-weight:600;pointer-events:none;animation:fade .3s}
/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:10px;position:relative;box-shadow:0 1px 0 rgba(32,17,110,.04)}
.order{display:grid;grid-template-columns:84px 1fr;gap:12px;align-items:center;animation:pop .35s}
@keyframes pop{from{transform:scale(.92);opacity:0}}
.order .pic{width:84px;height:66px;border-radius:12px;background:#eef0fb;display:grid;place-items:center;overflow:hidden}
.order .pic svg{width:76px;height:58px}
.order h3{margin:0;font-family:var(--serif);font-size:1.05rem;line-height:1.15}
.order .k{font-size:.78rem;color:var(--mut);margin:2px 0 6px}
.dom{display:inline-block;font-size:.6rem;letter-spacing:.14em;text-transform:uppercase;font-weight:800;padding:2px 8px;border-radius:99px;color:#fff;vertical-align:middle}
.order .row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pay{font-weight:800;color:var(--teal)}
.cx{font-size:.72rem;color:var(--mut)}
.btn{background:linear-gradient(135deg,var(--blue),var(--mint));color:#fff;border:0;border-radius:99px;padding:10px 18px;font-weight:800;font-size:.95rem;box-shadow:0 6px 18px rgba(17,100,179,.3);transition:transform .1s}
.btn:active{transform:scale(.96)}
.btn.sm{padding:7px 14px;font-size:.85rem;box-shadow:none}
.btn.ghost{background:#fff;color:var(--indigo);border:2px solid var(--indigo);box-shadow:none}
.btn.fz{background:linear-gradient(135deg,var(--fuchsia-d),var(--fuchsia))}
.btn.yel{background:var(--yel);color:var(--indigo)}
.btn:disabled{opacity:.45;filter:grayscale(.6);box-shadow:none;cursor:default}
.order.locked{opacity:.75}
.order.locked .pic{filter:grayscale(1)}
.lock{font-size:.75rem;color:var(--red);font-weight:700}
.empty{text-align:center;color:var(--mut);padding:18px 10px;font-size:.9rem;border:2px dashed var(--line);border-radius:16px}
/* jobs */
.job{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;padding:8px 10px}
.job .pic{width:44px;height:36px;border-radius:8px;background:#eef0fb;display:grid;place-items:center}
.job .pic svg{width:40px;height:30px}
.job b{font-size:.9rem;display:block}
.job small{color:var(--mut);font-size:.75rem}
.job .bar{height:8px;background:#eceaf7;border-radius:9px;overflow:hidden;margin-top:5px}
.job .bar i{display:block;height:100%;width:var(--p,0%);background:linear-gradient(90deg,var(--blue),var(--mint));transition:width .5s linear}
.job.wait .bar i{background:var(--yel)}
.job.pause .bar i{background:var(--red)}
.stars{color:var(--yel);letter-spacing:1px;font-size:.85rem;text-shadow:0 0 0 var(--indigo)}
/* shop */
.shop-tabs{display:flex;gap:6px;margin:4px 0 10px;overflow-x:auto;padding-bottom:4px}
.shop-tabs button{flex:none;border:2px solid var(--line);background:#fff;border-radius:99px;padding:6px 12px;font-weight:700;font-size:.8rem;color:var(--indigo)}
.shop-tabs button.on{background:var(--indigo);color:#fff;border-color:var(--indigo)}
.up{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center}
.up .pic{width:64px;height:56px;border-radius:12px;background:#eef0fb;display:grid;place-items:center}
.up .pic svg{width:58px;height:48px}
.up h3{margin:0;font-size:.98rem;font-family:var(--serif)}
.up p{margin:2px 0 0;font-size:.78rem;color:var(--mut);line-height:1.3}
.up .eff{display:inline-block;margin-top:4px;font-size:.72rem;font-weight:700;color:var(--teal);background:#e6f7f1;padding:2px 8px;border-radius:99px}
.up .eff.op{color:var(--fuchsia-d);background:#fbe7f2}
.up.owned{background:#f0fbf7;border-color:#bfe9d9}
.up.owned .buy{background:var(--mint);color:var(--indigo);box-shadow:none}
.up .buy{min-width:82px;text-align:center;white-space:nowrap}
.up .buy small{display:block;font-size:.66rem;opacity:.85;font-weight:600}
.up.locked{opacity:.6}
.staffline{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 2px}
.chip{background:#eef0fb;border-radius:99px;padding:3px 9px;font-size:.74rem;font-weight:700;display:inline-flex;gap:5px;align-items:center}
.chip i{width:10px;height:10px;border-radius:50%;display:inline-block}
/* catalogus */
.cat{display:grid;grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:8px}
.cat .it{background:#fff;border:1px solid var(--line);border-radius:14px;padding:8px;text-align:center;font-size:.72rem;font-weight:700;line-height:1.2}
.cat .it svg{width:100%;height:56px}
.cat .it.un{opacity:.45;filter:grayscale(1)}
.cat .it small{display:block;color:var(--mut);font-weight:600}
.stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:8px}
.stat3 div{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 6px;text-align:center}
.stat3 b{display:block;font-family:var(--serif);font-size:1.3rem;color:var(--indigo)}
.stat3 small{font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);font-weight:800}
.titles{display:flex;flex-direction:column;gap:6px}
.titles div{display:flex;align-items:center;gap:8px;font-size:.85rem;padding:8px 10px;border-radius:12px;background:#fff;border:1px solid var(--line)}
.titles div.got{background:#fff8dc;border-color:#f3d970}
.titles div.now{outline:2px solid var(--fuchsia-d)}
.titles span.n{margin-left:auto;font-size:.72rem;color:var(--mut)}
/* nav */
#nav{position:absolute;left:0;right:0;bottom:0;display:flex;background:#fff;border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:6}
#nav button{flex:1;background:transparent;border:0;padding:6px 2px;font-size:.66rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);border-radius:12px;position:relative}
#nav button span{display:block;font-size:1.35rem;margin-bottom:1px}
#nav button.on{color:var(--indigo);background:#eef0fb}
#nav button .n{position:absolute;top:2px;right:18%;background:var(--red);color:#fff;font-size:.62rem;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 4px}
/* modal / design flow */
.ov{position:absolute;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;animation:fade .25s}
.ov.dim{background:rgba(32,17,110,.55);justify-content:center;align-items:center;padding:16px}
.ov .top{flex:none;background:var(--indigo);color:#fff;padding:10px 14px;display:flex;align-items:center;gap:10px}
.ov .top b{font-family:var(--serif);font-size:1.05rem}
.ov .top .x{margin-left:auto;background:transparent;border:2px solid rgba(255,255,255,.35);color:#fff;border-radius:50%;width:30px;height:30px}
.steps{display:flex;gap:4px;padding:8px 14px 0}
.steps i{flex:1;height:5px;border-radius:9px;background:#dedcf0}
.steps i.done{background:var(--mint)}
.steps i.now{background:var(--fuchsia-d)}
.ov .body{flex:1;overflow-y:auto;padding:14px 14px 100px}
.ov .foot{position:absolute;left:0;right:0;bottom:0;padding:10px 14px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--bg) 30%);display:flex;gap:8px;justify-content:center;pointer-events:none}
.ov .foot>*{pointer-events:auto}
.brief{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:grid;grid-template-columns:90px 1fr;gap:12px;align-items:center;margin-bottom:12px}
.brief .pic{width:90px;height:70px;border-radius:12px;background:#eef0fb;display:grid;place-items:center}
.brief .pic svg{width:84px;height:64px}
.brief h3{margin:0;font-family:var(--serif);font-size:1.1rem}
.brief p{margin:3px 0 0;font-size:.82rem;color:var(--mut);line-height:1.35}
.q{font-family:var(--serif);font-size:1.15rem;margin:6px 0 4px;line-height:1.2}
.qs{font-size:.85rem;color:var(--mut);margin:0 0 12px;line-height:1.35}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{background:#fff;border:2px solid var(--line);border-radius:14px;padding:10px 12px;font-weight:700;font-size:.88rem;color:var(--indigo);text-align:left;flex:1 1 45%;transition:transform .1s}
.chips button.sel{border-color:var(--blue);background:#e7f0fb}
.chips button.ok{border-color:var(--mint);background:#e6f7f1}
.chips button.bad{border-color:var(--red);background:#fde7ec;color:var(--red)}
.chips button.dim{opacity:.35;text-decoration:line-through}
.chips button:active{transform:scale(.97)}
.mats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mat{background:#fff;border:2px solid var(--line);border-radius:14px;padding:10px;font-size:.8rem}
.mat b{display:block;font-size:.9rem;margin-bottom:6px}
.mat .pr{display:grid;grid-template-columns:52px 1fr;gap:4px 6px;align-items:center;font-size:.68rem;color:var(--mut)}
.mat .pr i{display:block;height:6px;background:#eceaf7;border-radius:9px;overflow:hidden}
.mat .pr i:after{content:"";display:block;height:100%;width:var(--w);background:var(--blue);border-radius:9px}
.mat .pr span.hi{color:var(--fuchsia-d);font-weight:800}
.mat.sel{border-color:var(--blue);background:#e7f0fb}
.mat.ok{border-color:var(--mint);background:#e6f7f1}
.mat.bad{border-color:var(--red);background:#fde7ec}
.dimbox{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px}
.dimbox svg{width:100%;height:auto;display:block}
.readout{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.readout div{background:#eef0fb;border-radius:12px;padding:8px 10px;font-size:.72rem;color:var(--mut)}
.readout b{display:block;font-size:1.1rem;color:var(--indigo);font-family:var(--serif)}
.readout .good b{color:var(--teal)}
.readout .badv b{color:var(--red)}
input[type=range]{width:100%;accent-color:var(--fuchsia-d);height:36px}
.zone{position:relative;height:10px;border-radius:9px;background:#eceaf7;margin:0 8px 4px;overflow:hidden}
.zone i{position:absolute;top:0;bottom:0;background:var(--mint);opacity:.7}
.slots{display:flex;align-items:center;justify-content:center;gap:6px;margin:12px 0;flex-wrap:wrap}
.slot{width:96px;height:64px;border:2px dashed var(--lav);border-radius:14px;display:grid;place-items:center;text-align:center;font-size:.72rem;font-weight:700;color:var(--mut);background:#fff;padding:4px}
.slot.f{border-style:solid;border-color:var(--blue);background:#e7f0fb;color:var(--indigo)}
.slot.ok{border-color:var(--mint);background:#e6f7f1}
.slot.bad{border-color:var(--red);background:#fde7ec}
.arrow{font-size:1.2rem;color:var(--lav)}
.draw3{display:grid;gap:8px}
.draw3 button{background:#fff;border:2px solid var(--line);border-radius:14px;padding:8px;display:grid;grid-template-columns:120px 1fr;gap:10px;align-items:center;text-align:left;font-size:.8rem;color:var(--indigo)}
.draw3 button svg{width:120px;height:80px}
.draw3 button b{display:block;font-size:.88rem}
.draw3 button.ok{border-color:var(--mint);background:#e6f7f1}
.draw3 button.bad{border-color:var(--red);background:#fde7ec}
.fb{margin-top:12px;border-radius:14px;padding:10px 12px;font-size:.86rem;line-height:1.35;animation:pop .3s}
.fb.ok{background:#e6f7f1;color:var(--teal)}
.fb.no{background:#fde7ec;color:var(--red)}
.fb b{display:block;font-size:1rem}
/* result stamp */
.result{text-align:center;padding:10px 0}
.stamp{display:inline-block;border:4px solid var(--fuchsia-d);color:var(--fuchsia-d);font-family:var(--serif);font-size:1.5rem;padding:6px 18px;border-radius:8px;transform:rotate(-6deg);animation:stamp .5s cubic-bezier(.2,1.6,.4,1);letter-spacing:.06em;margin:10px 0}
@keyframes stamp{from{transform:rotate(-6deg) scale(2.2);opacity:0}}
.result .big{font-size:2.2rem;letter-spacing:4px;color:var(--yel);text-shadow:0 2px 0 rgba(32,17,110,.15);margin:4px 0}
.result p{color:var(--mut);font-size:.88rem;line-height:1.4;max-width:340px;margin:8px auto}
.handoff{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px;margin:12px 0;text-align:left;display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;font-size:.78rem}
.handoff .who{text-align:center}
.handoff .who b{display:block;font-family:var(--serif);font-size:.95rem}
.handoff .who span{color:var(--mut)}
.handoff .arr{font-size:1.6rem;color:var(--mint)}
/* toasts */
#toasts{position:absolute;left:12px;right:12px;bottom:calc(78px + env(safe-area-inset-bottom,0px));z-index:30;display:flex;flex-direction:column-reverse;gap:6px;pointer-events:none}
.toast{background:var(--indigo);color:#fff;padding:10px 14px;border-radius:14px;font-size:.85rem;font-weight:600;box-shadow:0 10px 30px rgba(32,17,110,.35);animation:toast 3.6s forwards;display:flex;gap:10px;align-items:center;border-left:5px solid var(--mint)}
.toast.gold{border-left-color:var(--yel);background:#3a1e8f}
.toast.red{border-left-color:var(--red)}
@keyframes toast{0%{opacity:0;transform:translateY(-10px)}8%{opacity:1;transform:none}85%{opacity:1}100%{opacity:0;transform:translateY(-6px)}}
/* dialog */
.dlg{background:#fff;border-radius:20px;padding:18px;max-width:400px;width:100%;box-shadow:0 30px 80px rgba(0,0,0,.4);animation:pop .3s}
.dlg h3{margin:0 0 6px;font-family:var(--serif);font-size:1.2rem}
.dlg p{margin:0 0 12px;font-size:.9rem;line-height:1.4;color:#3a3660}
.dlg .who{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.dlg .who svg{width:44px;height:44px}
.dlg .who b{display:block}
.dlg .who small{color:var(--mut)}
.dlg .opts{display:flex;flex-direction:column;gap:8px}
.dlg .opts button{background:#fff;border:2px solid var(--line);border-radius:14px;padding:10px 12px;font-weight:700;text-align:left;font-size:.88rem;color:var(--indigo)}
.dlg .opts button.ok{border-color:var(--mint);background:#e6f7f1}
.dlg .opts button.bad{border-color:var(--red);background:#fde7ec}
.dlg .actions{display:flex;gap:8px;justify-content:flex-end;margin-top:10px}
/* start */
#start{background:var(--indigo);color:#fff;align-items:center;justify-content:center;justify-content:safe center;text-align:center;padding:24px;overflow-y:auto}
#start>*{flex:none}
#start h1{font-family:var(--serif);font-size:clamp(2.4rem,12vw,3.4rem);margin:8px 0 4px;line-height:.95;letter-spacing:.02em}
#start h1 em{font-style:normal;background:linear-gradient(90deg,var(--mint),var(--fuchsia));-webkit-background-clip:text;background-clip:text;color:transparent}
#start .kick{font-size:.7rem;letter-spacing:.3em;text-transform:uppercase;font-weight:800;color:var(--mint)}
#start p{max-width:340px;font-size:.95rem;line-height:1.45;opacity:.9;margin:8px auto}
#start .two{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:360px;margin:16px auto;text-align:left}
#start .two div{background:rgba(255,255,255,.08);border-radius:16px;padding:12px;font-size:.8rem;line-height:1.35}
#start .two b{display:block;font-family:var(--serif);font-size:1.05rem;margin-bottom:2px}
#start .two svg{width:44px;height:44px;display:block;margin-bottom:6px}
#start .name{display:flex;gap:8px;justify-content:center;margin:10px 0}
#start input{font:inherit;font-weight:700;padding:10px 14px;border-radius:12px;border:0;width:200px;text-align:center}
#start .back{font-size:.72rem;opacity:.6;margin-top:16px}
.away{background:#fff;color:var(--indigo);border-radius:16px;padding:12px;margin:12px auto;max-width:340px;font-size:.85rem;text-align:left}
.away b{color:var(--teal)}
.lvlup{position:absolute;inset:0;z-index:40;display:grid;place-items:center;background:rgba(32,17,110,.75);animation:fade .3s}

}

/* 1 · Programma van eisen */
PUZZLES.eisen = (p, ctx) => {

/* 3 · Materiaalkeuze */

/* 4 · Schema (mechatronica): voelt → denkt → doet */
PUZZLES.schema = (p, ctx) => {
  const s = p.schema; const chips = shuffle([...s.chips, ...s.extra]); const filled = [null, null, null]; let checked = false;
  ctx.body.append(el('h3', { class: 'q' }, 'Systeemschema'), el('p', { class: 'qs', html: 'Elke machine <b>voelt</b>, <b>denkt</b> en <b>doet</b>. Zet de juiste onderdelen in de juiste volgorde. Twee onderdelen horen hier niet thuis.' }));
  const slots = ['voelt<br><small>sensor</small>', 'denkt<br><small>besturing</small>', 'doet<br><small>actuator</small>'].map((t, i) => el('button', { class: 'slot', html: t, onclick: () => { if (checked || filled[i] == null) return; Snd.tap(); const c = filled[i]; filled[i] = null; cbtns[c].classList.remove('sel'); cbtns[c].disabled = false; slots[i].classList.remove('f'); slots[i].innerHTML = t; upd(); } }));
  const slotRow = el('div', { class: 'slots' }, slots[0], el('span', { class: 'arrow' }, '→'), slots[1], el('span', { class: 'arrow' }, '→'), slots[2]);
  const wrap = el('div', { class: 'chips' });
  const cbtns = chips.map((c, ci) => el('button', { onclick: e => { if (checked) return; const i = filled.indexOf(null); if (i < 0) return; Snd.tap(); filled[i] = ci; e.currentTarget.classList.add('sel'); e.currentTarget.disabled = true; slots[i].classList.add('f'); slots[i].textContent = c; upd(); } }, c));
  cbtns.forEach(b => wrap.append(b));
  const chk = el('button', { class: 'btn', disabled: 'disabled', style: 'margin-top:14px', onclick: () => {
    checked = true; chk.remove(); let n = 0; filled.forEach((ci, i) => { const ok = chips[ci] === s.chips[i]; if (ok) n++; slots[i].classList.add(ok ? 'ok' : 'bad'); });
    const score = n === 3 ? 1 : n === 2 ? .5 : 0;
    ctx.done(score, score === 1 ? `<b>Klopt als een bus.</b> ${s.chips[0]} → ${s.chips[1]} → ${s.chips[2]}. De mechatronicus ontwerpt dit samenspel.` : `<b>Niet helemaal.</b> De juiste keten: ${s.chips[0]} (voelt) → ${s.chips[1]} (denkt) → ${s.chips[2]} (doet). Verkeerde volgorde = machine die het verkeerde doet.`);
