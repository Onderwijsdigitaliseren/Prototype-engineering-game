<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PROTOTYPE — Engineering game</title>
<meta name="description" content="Interactieve game: ontdek Engineering op het mbo. Vier missies, vier problemen, één engineer: jij.">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  /* huisstijl: indigo + wit, combinatie blauw + mint met verloop */
  --indigo:#20116e;--indigo2:#2d1b8f;--blue:#1164b3;--mint:#47d7ad;--teal:#138273;
  --orange:#ff8f1a;--lav:#9678dc;--fuchsia:#f391c8;--fuchsia-d:#c02a86;--pink:#f391c8;--red:#dd1c50;--yel:#ffc915;--lime:#e4f621;
  --bg:#ffffff;--bg2:#f4f4f9;--card:#ffffff;--card2:#f4f4f9;--line:#e3e2ef;--line2:#cfcde3;
  --txt:#1c1740;--mut:#5f5b86;--dim:#9a97b8;
  --acc:var(--blue);--grn:var(--teal);--org:var(--orange);--pur:var(--lav);
  --m1:#1164b3;--m2:#ff8f1a;--m3:#c02a86;--m4:#138273;
  --grad:linear-gradient(90deg,var(--blue),var(--mint));
  --grad2:linear-gradient(90deg,var(--indigo),var(--fuchsia));
  --r:14px;--sh:0 8px 24px rgba(32,17,110,.08);
  --serif:"Zilla Slab","Bitter",Georgia,"Times New Roman",serif;--sans:"Source Sans 3","Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
  font-size:16px;
}
html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);font-family:var(--sans);line-height:1.45;min-height:100%}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select{font:inherit}
h1,h2,h3{margin:0 0 .4em;line-height:1.15;font-weight:700;font-family:var(--serif);color:var(--indigo);text-wrap:balance}
h1{font-size:2rem}h2{font-size:1.5rem}h3{font-size:1.12rem}
p{margin:.4em 0}
small,.mut{color:var(--mut)}
.dim{color:var(--dim)}
#app{max-width:760px;margin:0 auto;padding:0 14px 120px;min-height:100vh}
html{scroll-padding-bottom:120px}
/* topbar — indigo balk zoals de Summa-titelbalk */
#top{position:sticky;top:0;z-index:20;background:var(--indigo);color:#fff;margin:0 -14px 14px;padding:10px 14px;display:flex;align-items:center;gap:12px;box-shadow:0 2px 12px rgba(32,17,110,.25)}
#top:after{content:"";position:absolute;left:0;right:0;bottom:-4px;height:4px;background:linear-gradient(90deg,var(--blue),var(--mint) 60%,var(--fuchsia))}
#top .logo{font-family:var(--serif);font-weight:700;letter-spacing:.08em;font-size:1rem;color:#fff}
#top .logo span{color:var(--fuchsia)}
#top .xp{flex:1;min-width:60px}
.bar{height:8px;background:rgba(255,255,255,.18);border-radius:99px;overflow:hidden;position:relative}
.bar>i{display:block;height:100%;background:var(--grad);border-radius:99px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
#top .xpl{font-size:.72rem;color:rgba(255,255,255,.8);display:flex;justify-content:space-between;margin-bottom:3px}
.icon-btn{width:38px;height:38px;border-radius:12px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);display:grid;place-items:center;color:#fff;flex:none}
/* screens */
.screen{animation:in .35s ease}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin:12px 0;box-shadow:var(--sh)}
.card.tight{padding:14px}
.card.acc{border-color:transparent;background:var(--indigo);color:#fff;position:relative;overflow:hidden}
.card.acc h2,.card.acc h3{color:#fff}.card.acc .mut,.card.acc small{color:rgba(255,255,255,.75)}
.card.acc:before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--grad)}
.card.acc .input{background:#fff;color:var(--txt)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 20px;border-radius:12px;font-weight:700;background:var(--indigo);color:#fff;transition:transform .12s,box-shadow .2s,opacity .2s;box-shadow:0 6px 18px rgba(32,17,110,.22);min-height:46px;text-align:center}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(1px) scale(.99)}
.btn[disabled]{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none}
.btn.sec{background:var(--card2);color:var(--indigo);border:1px solid var(--line2);box-shadow:none}
.btn.ghost{background:transparent;color:var(--mut);box-shadow:none;padding:10px 14px}
.btn.org{background:var(--grad);color:#fff;box-shadow:0 6px 18px rgba(17,100,179,.28)}
.btn.grn{background:var(--teal);color:#fff;box-shadow:0 6px 18px rgba(19,130,115,.28)}
.btn.big{width:100%;padding:16px;font-size:1.05rem}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.between{justify-content:space-between}
.row.end{justify-content:flex-end}
.tag{display:inline-block;font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:3px 9px;border-radius:99px;background:var(--bg2);color:var(--mut)}
.tag.c1{background:rgba(17,100,179,.12);color:var(--m1)}
.tag.c2{background:rgba(255,143,26,.16);color:#b85d00}
.tag.c3{background:rgba(243,145,200,.25);color:var(--fuchsia-d)}
.tag.c4{background:rgba(19,130,115,.14);color:var(--m4)}
.tag.eng{background:rgba(17,100,179,.12);color:var(--blue)}
.tag.vak{background:rgba(255,143,26,.16);color:#b85d00}
.tag.sam{background:rgba(243,145,200,.25);color:var(--fuchsia-d)}
.tag.ok{background:rgba(71,215,173,.22);color:var(--teal)}.tag.bad{background:rgba(221,28,80,.12);color:var(--red)}
.card.acc .tag.eng{background:rgba(255,255,255,.15);color:#fff}
.sticky-bottom{pointer-events:none;position:fixed;left:0;right:0;bottom:0;z-index:15;background:linear-gradient(rgba(255,255,255,0),rgba(255,255,255,.96) 35%);padding:18px 14px 14px}
.sticky-bottom>div{max-width:760px;margin:0 auto;display:flex;gap:10px;justify-content:flex-end;align-items:center}
.sticky-bottom>div>*{pointer-events:auto}
/* start */
.hero{text-align:center;padding:36px 10px 20px}
.hero .kicker{color:var(--fuchsia-d);letter-spacing:.3em;font-weight:700;font-size:.8rem}
.hero h1{font-size:clamp(2.6rem,10vw,4.2rem);letter-spacing:-.02em;margin:.1em 0;color:var(--indigo)}
.hero h1 em{font-style:normal;background:linear-gradient(90deg,var(--blue),var(--mint) 55%,var(--fuchsia));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p.lead{font-size:1.1rem;color:var(--mut);max-width:34ch;margin:0 auto}
.payoff{display:inline-block;background:#fff;color:var(--indigo);font-weight:700;line-height:1.05;padding:8px 10px;border-radius:6px;font-size:.85rem;text-align:left}
.input{width:100%;padding:14px 16px;border-radius:12px;background:var(--bg2);border:1px solid var(--line2);color:var(--txt);outline:none;font-size:1.05rem}
.input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(17,100,179,.15)}
.avatars{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.avatars button{aspect-ratio:1;border-radius:12px;border:2px solid transparent;display:grid;place-items:center;font-weight:900;font-size:1.3rem;transition:transform .12s;color:#fff}
.avatars button.on{border-color:var(--indigo);transform:scale(1.06);box-shadow:0 0 0 3px rgba(255,255,255,.9)}
.av{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-weight:900;color:#fff;flex:none}
/* chat */
.chat{display:flex;flex-direction:column;gap:10px}
.msg{display:flex;gap:10px;align-items:flex-end;max-width:92%;animation:in .3s ease}
.msg .b{background:var(--bg2);border:1px solid var(--line);padding:11px 14px;border-radius:16px;border-bottom-left-radius:4px}
.msg .name{font-size:.72rem;color:var(--blue);margin-bottom:2px;font-weight:700}
.msg.me{align-self:flex-end;flex-direction:row-reverse}
.typing{display:inline-flex;gap:4px;padding:6px 2px}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--dim);animation:ty 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes ty{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-4px);opacity:1}}
/* hub */
.mission{display:flex;gap:14px;align-items:center;padding:14px 14px 14px 18px;border-radius:var(--r);background:var(--card);border:1px solid var(--line);margin:10px 0;text-align:left;width:100%;transition:transform .12s,box-shadow .2s;position:relative;overflow:hidden;box-shadow:var(--sh)}
.mission:hover{transform:translateY(-2px);box-shadow:0 12px 28px rgba(32,17,110,.12)}
.mission .ic{width:56px;height:56px;border-radius:12px;display:grid;place-items:center;flex:none}
.mission .ic svg{width:32px;height:32px}
.mission .t{flex:1;min-width:0}
.mission .t h3{margin:0}
.mission .t p{margin:2px 0 0;color:var(--mut);font-size:.9rem}
.mission .sc{font-weight:900;font-size:1.2rem;text-align:right;flex:none;font-family:var(--serif)}
.mission .sc small{display:block;font-weight:600;font-size:.7rem;font-family:var(--sans)}
.mission.done{border-color:rgba(71,215,173,.6)}
.mission .stripe{position:absolute;left:0;top:0;bottom:0;width:6px}
/* steps */
.steps{display:flex;gap:6px;margin:6px 0 14px}
.steps span{flex:1;height:6px;border-radius:99px;background:var(--line)}
.steps span.on{background:var(--grad)}
.steps span.done{background:var(--blue);opacity:.45}
.steps span.vak.on{background:var(--orange)}.steps span.vak.done{background:var(--orange)}
.steplabel{font-size:.75rem;letter-spacing:.15em;text-transform:uppercase;color:var(--blue);font-weight:700}
/* controls */
.ctl{margin:12px 0}
.ctl label{display:flex;justify-content:space-between;font-weight:700;font-size:.92rem;margin-bottom:6px;color:var(--indigo)}
.ctl label b{color:var(--blue);font-variant-numeric:tabular-nums;white-space:nowrap;margin-left:10px}
input[type=range]{width:100%;accent-color:var(--blue);height:28px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1;min-width:70px;padding:10px 6px;overflow-wrap:anywhere;line-height:1.2;border-radius:10px;background:var(--bg2);border:1px solid var(--line2);font-weight:700;font-size:.88rem;color:var(--mut)}
.seg button.on{background:var(--indigo);border-color:var(--indigo);color:#fff}
.tog{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border-radius:10px;background:var(--bg2);border:1px solid var(--line2);margin:6px 0;width:100%;text-align:left}
.tog .sw{width:44px;height:26px;border-radius:99px;background:var(--line2);position:relative;flex:none;transition:background .2s}
.tog .sw:after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.tog.on{border-color:var(--blue)}
.tog.on .sw{background:var(--grad)}.tog.on .sw:after{left:21px}
.tog small{display:block;color:var(--mut)}
/* metrics */
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:10px 0}
.met{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.met .l{font-size:.72rem;color:var(--mut);text-transform:uppercase;letter-spacing:.08em;font-weight:700}
.met .v{font-size:1.25rem;font-weight:700;font-variant-numeric:tabular-nums;color:var(--indigo);font-family:var(--serif)}
.met .s{font-size:.75rem;color:var(--mut)}
.met.ok{border-color:var(--mint);background:rgba(71,215,173,.1)}.met.ok .v{color:var(--teal)}
.met.bad{border-color:rgba(221,28,80,.5);background:rgba(221,28,80,.06)}.met.bad .v{color:var(--red)}
.met.warn{border-color:var(--yel);background:rgba(255,201,21,.12)}.met.warn .v{color:#8a6a00}
.viz{background:linear-gradient(180deg,#eef3fb,#f7f8fc);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:10px 0;position:relative}
.viz svg,.viz canvas{display:block;width:100%;height:auto}
.viz .hint{position:absolute;right:10px;top:8px;font-size:.72rem;color:var(--mut);background:rgba(255,255,255,.8);padding:3px 8px;border-radius:99px}
.fb{padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--bg2);margin:10px 0;font-size:.95rem}
.fb.ok{border-color:var(--mint);background:rgba(71,215,173,.12)}
.fb.bad{border-color:rgba(221,28,80,.4);background:rgba(221,28,80,.06)}
.fb.info{border-color:rgba(17,100,179,.3);background:rgba(17,100,179,.06)}
.fb.vak{border-color:rgba(255,143,26,.5);background:rgba(255,143,26,.1)}
/* persona */
.persona{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:12px;background:var(--bg2);border:1px solid var(--line);margin:8px 0}
.persona .stars{color:var(--fuchsia-d);letter-spacing:2px;font-size:.95rem}
.persona .q{color:var(--txt);font-size:.95rem;font-style:italic;font-family:var(--serif)}
/* choices */
.choice{display:block;width:100%;text-align:left;padding:14px;border-radius:12px;background:var(--bg2);border:1px solid var(--line2);margin:8px 0;transition:border-color .15s}
.choice:hover{border-color:var(--blue)}
.choice.good{border-color:var(--teal);background:rgba(71,215,173,.15)}
.choice.bad{border-color:var(--red);background:rgba(221,28,80,.07)}
.choice[disabled]{cursor:default}
/* wie doet wat */
.wdw-card{background:var(--indigo);color:#fff;border-radius:16px;padding:26px 20px;text-align:center;min-height:150px;display:grid;place-items:center;font-size:1.15rem;font-weight:700;margin:12px 0;animation:in .3s ease;font-family:var(--serif)}
.wdw-card .mut{color:rgba(255,255,255,.75)}
.wdw-btns{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.wdw-btns button{padding:14px 6px;border-radius:12px;font-weight:700;border:1px solid var(--line2);background:var(--bg2)}
.wdw-btns button.eng{color:var(--blue)}.wdw-btns button.vak{color:#b85d00}.wdw-btns button.sam{color:var(--fuchsia-d)}
.wdw-btns button.hit{background:rgba(71,215,173,.3);border-color:var(--teal)}
.wdw-btns button.miss{background:rgba(221,28,80,.12);border-color:var(--red)}
/* badges */
.badges{display:flex;gap:8px;flex-wrap:wrap}
.badge{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:99px;background:rgba(243,145,200,.12);border:1px solid rgba(243,145,200,.5);font-size:.85rem;font-weight:700;color:var(--indigo)}
.badge.off{background:var(--bg2);border-color:var(--line)}
.badge .d{width:10px;height:10px;border-radius:50%;background:var(--fuchsia);box-shadow:0 0 8px rgba(243,145,200,.9)}
.badge.off{opacity:.4}.badge.off .d{background:var(--dim);box-shadow:none}
/* score ring */
.ring{width:130px;height:130px;margin:0 auto;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring .n{position:absolute;inset:0;display:grid;place-items:center;font-size:2rem;font-weight:700;font-family:var(--serif);color:var(--indigo)}
.ring .n small{display:block;font-size:.7rem;color:var(--mut);text-align:center;font-family:var(--sans)}
/* toast */
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);background:var(--indigo);color:#fff;padding:12px 18px;border-radius:12px;font-weight:700;opacity:0;pointer-events:none;transition:all .3s;z-index:50;box-shadow:var(--sh);max-width:92vw;text-align:center;width:max-content}
#toast.show{opacity:1;transform:translateX(-50%)}
/* impact counters */
.impact{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.impact .it{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:14px}
.impact .it .n{font-size:1.8rem;font-weight:700;font-family:var(--serif)}
.impact .it .l{font-size:.85rem;color:var(--mut)}
/* compare */
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:stretch}
.vs .col{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:14px}
.vs .col h3{font-size:1rem}
.vs .col ul{margin:6px 0 0;padding-left:18px;color:var(--mut);font-size:.9rem}
.vs .col ul li{margin:4px 0}
.vs .mid{display:grid;place-items:center;font-weight:900;color:var(--dim)}
.vs .col.eng{border-color:rgba(17,100,179,.4);border-top:4px solid var(--blue)}.vs .col.eng h3{color:var(--blue)}
.vs .col.vak{border-color:rgba(255,143,26,.5);border-top:4px solid var(--orange)}.vs .col.vak h3{color:#b85d00}
@media(max-width:520px){.vs{grid-template-columns:1fr}.vs .mid{display:none}}
.fact{border-left:4px solid var(--orange);padding:8px 12px;background:rgba(255,143,26,.08);border-radius:0 10px 10px 0;font-size:.9rem;margin:10px 0}
.fact b{color:#b85d00}
.pulse{animation:pulse 1.4s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(17,100,179,.45)}70%{box-shadow:0 0 0 12px rgba(17,100,179,0)}}
.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:40}
.kv{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed var(--line2);font-size:.95rem}
.kv:last-child{border:0}
.kv b{font-variant-numeric:tabular-nums;color:var(--indigo)}
.center{text-align:center}
.mt{margin-top:14px}.mb{margin-bottom:14px}
.hidden{display:none!important}
/* roles */
.roles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
@media(max-width:520px){.roles{grid-template-columns:1fr}}
.role{position:relative;text-align:left;padding:18px;border-radius:var(--r);background:var(--card);border:2px solid var(--line);transition:transform .15s,border-color .2s;min-height:150px;box-shadow:var(--sh)}
.role:hover{transform:translateY(-2px)}
.role .role-ic{font-size:2rem;margin-bottom:6px}
.role h3{margin:0}.role p{margin:0 0 8px;font-size:.9rem}
.role .role-lines{display:none;margin:0;padding-left:18px;color:var(--txt);font-size:.92rem}
.role .role-lines li{margin:4px 0}
.role .tap{font-size:.75rem;color:var(--dim);letter-spacing:.1em;text-transform:uppercase;font-weight:700;margin-top:8px}
.role.open .role-lines{display:block;animation:in .3s ease}
.role.open .tap{display:none}
.role.vak.open{border-color:var(--orange);background:linear-gradient(180deg,rgba(255,143,26,.1),transparent),var(--card)}
.role.eng.open{border-color:var(--blue);background:linear-gradient(180deg,rgba(17,100,179,.1),transparent),var(--card)}
/* eisen chips */
.eisen{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.eis{font-size:.85rem;font-weight:600;padding:7px 11px;border-radius:8px;background:var(--bg2);border:1px solid var(--line2);color:var(--txt)}
.eis.ok{border-color:var(--teal);color:var(--teal);background:rgba(71,215,173,.15)}
.eis.bad{border-color:var(--red);color:var(--red);background:rgba(221,28,80,.07)}
/* sketch pad */
.pad{position:relative;aspect-ratio:5/3;border-radius:12px;overflow:hidden;border:1px solid var(--line2);background:#fff;touch-action:none;margin:10px 0 8px;box-shadow:inset 0 0 0 1px #fff,var(--sh)}
.pad canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.pad canvas:last-child{cursor:crosshair}
.tools{margin-bottom:10px}
.swatches{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.sw{width:32px;height:32px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px var(--line2)}
.sw.on{box-shadow:0 0 0 2px var(--indigo);transform:scale(1.1)}
.tb{padding:7px 11px;border-radius:8px;background:var(--bg2);border:1px solid var(--line2);font-size:.82rem;font-weight:700;color:var(--mut)}
.tb.on{border-color:var(--indigo);color:var(--indigo);background:#fff}
.sketch-result{margin-top:12px}
.sketch-result img{width:100%;max-width:360px;border-radius:10px;border:2px solid var(--fuchsia);display:block;margin:0 auto 6px}
.sketchbook{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sketchbook figure{margin:0}.sketchbook img{width:100%;border-radius:8px;border:1px solid var(--line2);display:block}
.sketchbook figcaption{font-size:.8rem;color:var(--mut);margin-top:4px}
.mission img.ic{object-fit:cover;border:1px solid var(--line2)}
/* precision meter */
.meter{position:relative;height:46px;border-radius:10px;background:var(--bg2);border:1px solid var(--line2);margin:14px 0;overflow:hidden}
.zone{position:absolute;top:0;bottom:0;background:rgba(71,215,173,.35);border-left:2px solid var(--teal);border-right:2px solid var(--teal)}
.needle{position:absolute;top:-2px;bottom:-2px;width:6px;margin-left:-3px;background:var(--indigo);border-radius:3px;box-shadow:0 0 8px rgba(32,17,110,.4)}
.needle.hit{background:var(--teal);box-shadow:0 0 14px var(--mint)}.needle.miss{background:var(--red);box-shadow:0 0 14px var(--red)}
/* time slider (sporthal) */
.clock{display:flex;align-items:center;gap:10px;margin:8px 0}
.clock b{min-width:52px;text-align:right;color:var(--indigo);font-variant-numeric:tabular-nums}
/* naam + initiaal */
.name-row{display:flex;gap:10px;align-items:center}
.name-row .input{flex:1}
.av.big-av{width:52px;height:52px;font-size:1.4rem;border-radius:14px;box-shadow:0 4px 14px rgba(0,0,0,.18);transition:background .3s}
.card.acc .btn{background:var(--grad);color:#fff;box-shadow:0 6px 18px rgba(71,215,173,.25)}
.card.acc .btn.ghost{background:transparent;color:rgba(255,255,255,.75);box-shadow:none}
.card.acc .btn.ghost:hover{color:#fff}
.card.acc .pulse{animation:pulseW 1.4s infinite}
@keyframes pulseW{0%,100%{box-shadow:0 0 0 0 rgba(71,215,173,.5)}70%{box-shadow:0 0 0 12px rgba(71,215,173,0)}}
.icon-btn.fx{background:rgba(243,145,200,.22);border-color:rgba(243,145,200,.6);font-size:1.15rem;font-weight:700}
.icon-btn.fx:hover{background:var(--fuchsia);color:var(--indigo)}
</style>

<body>
<div id="top"></div>
<div id="app"></div>
<div id="toast"></div>
<script>
/* ===== PROTOTYPE — core ===== */
'use strict';
const $ = (s, el = document) => el.querySelector(s);
const el = (tag, attrs = {}, ...kids) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') n.className = v;
    else if (k === 'html') n.innerHTML = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) n.setAttribute(k, v);
  }
  for (const k of kids.flat()) if (k != null) n.append(k.nodeType ? k : document.createTextNode(k));
  return n;
};
const fmt = (n, d = 0) => Number(n).toLocaleString('nl-NL', { maximumFractionDigits: d, minimumFractionDigits: d });
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const wait = ms => new Promise(r => setTimeout(r, ms));
const rnd = (a, b) => a + Math.random() * (b - a);

/* ---- sound (WebAudio, no files) ---- */
const Snd = {
  ctx: null, on: true,
  init() { if (!this.ctx) { try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { this.on = false; } } },
  tone(f, t = .08, type = 'sine', g = .08, when = 0) {
    if (!this.on || !this.ctx) return;
    const c = this.ctx, o = c.createOscillator(), a = c.createGain();
    o.type = type; o.frequency.value = f; a.gain.value = g;
    o.connect(a); a.connect(c.destination);
    const s = c.currentTime + when; o.start(s); a.gain.setValueAtTime(g, s); a.gain.exponentialRampToValueAtTime(.0001, s + t); o.stop(s + t + .02);
  },
  click() { this.tone(660, .05, 'square', .03); },
  ok() { [523, 659, 784].forEach((f, i) => this.tone(f, .12, 'triangle', .06, i * .07)); },
  win() { [523, 659, 784, 1047].forEach((f, i) => this.tone(f, .18, 'triangle', .07, i * .1)); },
  bad() { this.tone(220, .18, 'sawtooth', .04); this.tone(180, .2, 'sawtooth', .04, .08); },
  tick() { this.tone(1200, .03, 'square', .015); }
};
document.addEventListener('pointerdown', () => Snd.init(), { once: true });

/* ---- state ---- */
const DEFAULT = () => ({ name: '', avatar: 0, xp: 0, started: Date.now(), missions: {}, badges: [], wdw: { ok: 0, tot: 0 }, iterations: 0, seenIntro: false });
let S = DEFAULT();
const store = {
  load() { try { const j = localStorage.getItem('prototype_v1'); if (j) S = Object.assign(DEFAULT(), JSON.parse(j)); } catch (e) { } },
  save() { try { localStorage.setItem('prototype_v1', JSON.stringify(S)); } catch (e) { } },
  reset() { S = DEFAULT(); try { localStorage.removeItem('prototype_v1'); } catch (e) { } }
};
const AV_COLORS = ['#1164b3', '#ff8f1a', '#c02a86', '#138273', '#20116e', '#9678dc'];
const CONFETTI = ['#1164b3', '#47d7ad', '#ff8f1a', '#f391c8', '#20116e', '#ffc915'];
const avColor = n => AV_COLORS[[...(n || 'x')].reduce((a, c) => a + c.charCodeAt(0), 0) % AV_COLORS.length];
const initial = n => (n || '?').trim().charAt(0).toUpperCase();

const BADGES = [
  { id: 'first', t: 'Eerste prototype', d: 'Je eerste ontwerp goedgekeurd' },
  { id: 'iter', t: 'Iteratie-kampioen', d: '3+ testrondes in één missie — zo werkt engineering' },
  { id: 'green', t: 'Duurzame denker', d: 'Een goedgekeurd ontwerp met 4+ blaadjes duurzaamheid' },
  { id: 'hands', t: 'Gouden handen', d: 'Vakmens-ronde foutloos' },
  { id: 'team', t: 'Teamspeler', d: 'Twee keer bijna perfect samengewerkt met de vakmensen' },
  { id: 'world', t: 'Wereldveranderaar', d: 'Alle vier de ontwerpen afgerond' },
];
function giveBadge(id) {
  if (S.badges.includes(id)) return;
  S.badges.push(id); store.save();
  const b = BADGES.find(x => x.id === id);
  toast('🏅 Badge: ' + b.t); Snd.win();
}
function addXP(n) { S.xp += n; store.save(); renderTop(); }

/* ---- ui helpers ---- */
function toast(txt, ms = 2200) {
  const t = $('#toast'); t.textContent = txt; t.classList.add('show');
  clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('show'), ms);
}
function confetti() {
  const c = el('canvas', { class: 'confetti' }); document.body.append(c);
  c.width = innerWidth; c.height = innerHeight; const x = c.getContext('2d');
  const P = Array.from({ length: 120 }, () => ({ x: rnd(0, c.width), y: rnd(-c.height, 0), r: rnd(4, 9), c: CONFETTI[Math.floor(rnd(0, 6))], v: rnd(2, 5), a: rnd(0, 6) }));
  let f = 0; (function loop() {
    x.clearRect(0, 0, c.width, c.height);
    P.forEach(p => { p.y += p.v; p.a += .1; x.fillStyle = p.c; x.save(); x.translate(p.x, p.y); x.rotate(p.a); x.fillRect(-p.r / 2, -p.r / 2, p.r, p.r * .6); x.restore(); });
    if (++f < 160) requestAnimationFrame(loop); else c.remove();
  })();
}
function ring(pct, color = 'var(--blue)', label = 'punten') {
  const r = 54, C = 2 * Math.PI * r;
  const w = el('div', { class: 'ring' });
  w.innerHTML = `<svg viewBox="0 0 130 130" width="130" height="130"><circle cx="65" cy="65" r="${r}" fill="none" stroke="var(--line)" stroke-width="10"/><circle cx="65" cy="65" r="${r}" fill="none" stroke="${color}" stroke-width="10" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C}" style="transition:stroke-dashoffset 1.2s cubic-bezier(.2,.8,.2,1)"/></svg><div class="n"><span>0<small>${label}</small></span></div>`;
  requestAnimationFrame(() => setTimeout(() => {
    w.querySelectorAll('circle')[1].style.strokeDashoffset = C * (1 - clamp(pct, 0, 100) / 100);
    countTo(w.querySelector('.n span'), Math.round(pct), 1000, label);
  }, 50));
  return w;
}
function countTo(node, target, ms = 1000, label = '', suffix = '') {
  const t0 = performance.now();
  (function step(t) {
    const k = clamp((t - t0) / ms, 0, 1), e = 1 - Math.pow(1 - k, 3);
    node.innerHTML = fmt(Math.round(target * e)) + suffix + (label ? `<small>${label}</small>` : '');
    if (k < 1) requestAnimationFrame(step);
  })(t0);
}
function steps(cur, labels) {
  return el('div', {}, el('div', { class: 'steplabel' }, `Stap ${cur + 1}/${labels.length} · ${labels[cur]}`),
    el('div', { class: 'steps' }, labels.map((l, i) => el('span', { class: i < cur ? 'done' : i === cur ? 'on' : '' }))));
}
async function chat(container, msgs, { speed = 1, skipBtn = true } = {}) {
  const box = el('div', { class: 'chat' }); container.append(box);
  let skip = false;
  const sb = skipBtn ? el('button', { class: 'btn ghost', onclick: () => { skip = true; } }, 'Overslaan ›') : null;
  if (sb) container.append(el('div', { class: 'row end' }, sb));
  for (const m0 of msgs) {
    const m = { ...m0, text: m0.text.replace(/\{name\}/g, S.name) };
    if (!skip) {
      const ty = el('div', { class: 'msg' + (m.me ? ' me' : '') }, el('div', { class: 'b' }, el('div', { class: 'typing' }, el('i'), el('i'), el('i'))));
      box.append(ty); ty.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
      await wait(clamp(m.text.length * 14 / speed, 350, 1400));
      ty.remove();
    }
    const who = m.me ? S.name : (m.from || 'Sam');
    box.append(el('div', { class: 'msg' + (m.me ? ' me' : '') }, el('div', { class: 'b' }, el('div', { class: 'name' }, who), el('div', { html: m.text }))));
    if (!skip) { Snd.tick(); box.lastChild.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); await wait(220 / speed); }
  }
  if (sb) sb.remove();
}
function seg(options, value, onChange) {
  const w = el('div', { class: 'seg' });
  const draw = () => { w.innerHTML = ''; options.forEach(o => w.append(el('button', { class: o.v === value ? 'on' : '', onclick: () => { value = o.v; Snd.click(); draw(); onChange(value); } }, o.t))); };
  draw(); return w;
}
function slider(label, min, max, step, value, unitFn, onChange) {
  const b = el('b', {}, unitFn(value));
  const inp = el('input', { type: 'range', min, max, step, value });
  inp.addEventListener('input', () => { b.textContent = unitFn(+inp.value); onChange(+inp.value); });
  const w = el('div', { class: 'ctl' }, el('label', {}, el('span', {}, label), b), inp);
  w.set = v => { inp.value = v; b.textContent = unitFn(v); };
  return w;
}
function toggle(label, sub, value, onChange) {
  const t = el('button', { class: 'tog' + (value ? ' on' : ''), onclick: () => { value = !value; t.classList.toggle('on', value); Snd.click(); onChange(value); } },
    el('div', {}, el('div', { html: `<b>${label}</b>` }), sub ? el('small', {}, sub) : null), el('span', { class: 'sw' }));
  return t;
}
function metric(l, v, s, state) { return el('div', { class: 'met ' + (state || '') }, el('div', { class: 'l' }, l), el('div', { class: 'v' }, v), s ? el('div', { class: 'ss s' }, s) : null); }

/* ---- router ---- */
const app = () => $('#app');
function show(node) { const a = app(); a.innerHTML = ''; a.append(node); window.scrollTo({ top: 0 }); renderTop(); }
function renderTop() {
  const t = $('#top'); if (!t) return;
  const lvl = Math.floor(S.xp / 100) + 1, into = S.xp % 100;
  t.innerHTML = '';
  t.append(el('div', { class: 'logo' }, 'PROTO', el('span', {}, 'TYPE')));
  if (S.name) {
    t.append(el('div', { class: 'xp' }, el('div', { class: 'xpl' }, el('span', {}, `Level ${lvl}`), el('span', {}, `${S.xp} XP`)), el('div', { class: 'bar' }, el('i', { style: `width:${into}%` }))));
    t.append(el('div', { class: 'av', title: S.name, style: `background:${avColor(S.name)}` }, initial(S.name)));
  } else t.append(el('div', { class: 'xp' }));
  t.append(el('button', { class: 'icon-btn', title: 'Geluid aan/uit', onclick: () => { Snd.on = !Snd.on; renderTop(); } }, Snd.on ? '🔊' : '🔇'));
  t.append(el('button', { class: 'icon-btn fx', title: 'Opnieuw beginnen', onclick: restartGame }, '↻'));
}

function restartGame() {
  if (!S.name || confirm('Opnieuw beginnen? Alle scores, schetsen en badges van deze speler worden gewist.')) { store.reset(); Snd.click(); screenStart(); }
}
/* ===== SCREENS ===== */
function screenStart() {
  const inp = el('input', { class: 'input', placeholder: 'Hoe heet je?', maxlength: 18, value: S.name || '' });
  const badge = el('div', { class: 'av big-av', style: `background:${avColor(S.name)}` }, initial(S.name));
  inp.addEventListener('input', () => { badge.textContent = initial(inp.value); badge.style.background = avColor(inp.value.trim()); });
  const go = () => {
    const n = inp.value.trim(); if (!n) { inp.classList.add('shake'); setTimeout(() => inp.classList.remove('shake'), 400); inp.focus(); return; }
    const fresh = !S.name; S.name = n; if (fresh) S.started = Date.now(); store.save(); Snd.ok();
    S.seenIntro ? screenHub() : screenIntro();
  };
  inp.addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
  const hasSave = !!S.name;
  show(el('div', { class: 'screen' },
    el('div', { class: 'hero' },
      el('div', { class: 'kicker' }, 'ENGINEERING GAME'),
      el('h1', { html: 'PROTO<em>TYPE</em>' }),
      el('p', { class: 'lead' }, 'Vier opdrachtgevers. Vier problemen. Jij schetst, ontwerpt en test de oplossing.')),
    el('div', { class: 'card acc' },
      el('h3', {}, 'Wie ben jij?'),
      el('p', { class: 'mut', style: 'margin-top:-4px' }, 'Vul je naam in — je opdrachtgevers spreken je straks persoonlijk aan.'),
      el('div', { class: 'name-row' }, badge, inp),
      el('div', { class: 'mt' }, el('button', { class: 'btn big pulse', onclick: go }, hasSave ? 'Verder spelen →' : 'Start de game →')),
      hasSave ? el('div', { class: 'center mt' }, el('button', { class: 'btn ghost', onclick: restartGame }, '↻ Opnieuw beginnen')) : null),
    el('div', { class: 'card tight' }, el('small', {}, '⏱ Speelduur ± 30 minuten · werkt op telefoon, tablet en laptop · je voortgang wordt op dit apparaat bewaard.'))
  ));
}

function domainIcon(id) {
  const I = {
    m1: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M2 17h20M4 17V9l8-5 8 5v8M8 17v-6M16 17v-6M12 17V8"/></svg>',
    m2: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="8" width="18" height="9" rx="2"/><circle cx="8" cy="12.5" r="1.5"/><circle cx="16" cy="12.5" r="1.5"/><path d="M12 8V4M9 4h6M7 17v3M17 17v3"/></svg>',
    m3: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 13a8 8 0 0 1 16 0v2H4z"/><path d="M4 15h16M7 15v3M17 15v3M12 5v3"/></svg>',
    m4: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/></svg>'
  };
  return I[id];
}

function screenHub() {
  const done = Object.values(S.missions).filter(m => m.done).length;
  const box = el('div', { class: 'screen' });
  box.append(el('div', { class: 'card acc' },
    el('div', { class: 'row between' }, el('h2', { style: 'margin:0' }, done === 0 ? `Je bureau, ${S.name}` : done < 4 ? `Goed bezig, ${S.name}` : `Alles opgelost, ${S.name}!`), el('span', { class: 'tag eng' }, `${done}/4 missies`)),
    el('p', { class: 'mut' }, done === 0 ? 'Kies een opdracht. Elke missie duurt ongeveer 6 minuten.' : done < 4 ? 'De volgende opdrachtgever wacht op je.' : 'Bekijk jouw impact op de wereld.')));
  MISSIONS.forEach((m, i) => {
    const st = S.missions[m.id] || {};
    const b = el('button', { class: 'mission' + (st.done ? ' done' : ''), onclick: () => startMission(m) },
      el('span', { class: 'stripe', style: `background:${m.color}` }),
      el('div', { class: 'ic', style: `background:${m.color}22;color:${m.color}`, html: domainIcon(m.id) }),
      el('div', { class: 't' }, el('span', { class: 'tag c' + (i + 1) }, m.domain), el('h3', {}, m.title), el('p', {}, m.client)),
      el('div', { class: 'sc' }, st.done ? el('span', { style: 'color:var(--grn)' }, st.score, el('small', {}, 'van 100')) : el('span', { style: 'color:var(--mut)' }, '›')));
    box.append(b);
  });
  if (done === 4) box.append(el('button', { class: 'btn big grn mt', onclick: screenFinale }, '🌍 Bekijk jouw impact op de wereld →'));
  box.append(el('div', { class: 'card tight mt' }, el('h3', {}, 'Badges'), el('div', { class: 'badges' }, BADGES.map(b => el('span', { class: 'badge' + (S.badges.includes(b.id) ? '' : ' off'), title: b.d }, el('i', { class: 'd' }), b.t)))));
  box.append(el('div', { class: 'center mt' }, el('button', { class: 'btn ghost', onclick: screenStart }, '‹ Naar start')));
  show(box);
}

/* ===== INTRO ===== */
async function screenIntro() {
  const box = el('div', { class: 'screen' });
  const c = el('div', { class: 'card' }); box.append(c);
  show(box);
  await chat(c, [
    { text: `Hé {name}! Welkom bij <b>Studio NEXT</b>. Ik ben Sam.` },
    { text: 'Je fiets, je telefoon, de robot die je pakketje sorteert: iemand heeft dat ooit <b>bedacht</b>. Vandaag ben jij die iemand.' },
    { text: 'Maar eerst: in techniek heb je twee soorten helden. Tik ze allebei aan. 👇' },
  ]);
  let seen = new Set();
  const goBtn = el('button', { class: 'btn big', disabled: true, onclick: () => { S.seenIntro = true; store.save(); addXP(10); screenHub(); } }, 'Ik ben de engineer. Start! →');
  const mk = (role, icon, title, sub, lines, cls) => {
    const b = el('button', { class: 'role ' + cls, onclick: () => { b.classList.add('open'); seen.add(role); Snd.ok(); if (seen.size === 2) { goBtn.disabled = false; goBtn.classList.add('pulse'); } } },
      el('div', { class: 'role-ic' }, icon), el('h3', {}, title), el('p', { class: 'mut' }, sub),
      el('ul', { class: 'role-lines' }, lines.map(l => el('li', {}, l))), el('div', { class: 'tap' }, 'tik om te ontdekken'));
    return b;
  };
  box.append(el('div', { class: 'roles' },
    mk('vak', '🔧', 'De vakmens', 'Techniek · máákt het', ['Last, bouwt, monteert, installeert', 'Meester met machines en materiaal', 'Ziet in de praktijk wat wél werkt'], 'vak'),
    mk('eng', '🧠', 'De engineer', 'Engineering · bedénkt het', ['Ontwerpt: schetst, tekent in 3D, rekent', 'Test, verbetert, kiest duurzaam', 'Zorgt dat het veilig, betaalbaar en slim is'], 'eng')));
  box.append(el('div', { class: 'fb info center', html: 'Zonder vakmensen blijft een idee een tekening.<br>Zonder engineers is er niets om te maken.<br><b>Samen veranderen ze de wereld.</b>' }));
  box.append(el('div', { class: 'mt' }, goBtn));
}

/* ===== HUB ===== */
function screenHub() {
  const done = Object.values(S.missions).filter(m => m.done).length;
  const box = el('div', { class: 'screen' });
  box.append(el('div', { class: 'card acc' },
    el('div', { class: 'row between' }, el('h2', { style: 'margin:0' }, done === 0 ? `Jouw bureau, ${S.name}` : done < 4 ? `Goed bezig, ${S.name}` : `Alles ontworpen, ${S.name}!`), el('span', { class: 'tag eng' }, `${done}/4 ontwerpen`)),
    el('p', { class: 'mut' }, done === 0 ? 'Kies een opdracht. Jij schetst, ontwerpt en test. Daarna gaat het naar de vakmensen.' : done < 4 ? 'De volgende opdrachtgever wacht op je.' : 'Bekijk jouw impact op de wereld.')));
  MISSIONS.forEach((m, i) => {
    const st = S.missions[m.id] || {};
    const b = el('button', { class: 'mission' + (st.done ? ' done' : ''), onclick: () => startMission(m) },
      el('span', { class: 'stripe', style: `background:${m.color}` }),
      st.sketch ? el('img', { class: 'ic', src: st.sketch, alt: '' }) : el('div', { class: 'ic', style: `background:${m.color}22;color:${m.color}`, html: domainIcon(m.id) }),
      el('div', { class: 't' }, el('span', { class: 'tag c' + (i + 1) }, m.domain), el('h3', {}, m.title), el('p', {}, m.client)),
      el('div', { class: 'sc' }, st.done ? el('span', { style: 'color:var(--grn)' }, st.score, el('small', {}, leaves(st.eco || 0))) : el('span', { style: 'color:var(--mut)' }, '›')));
    box.append(b);
  });
  if (done === 4) box.append(el('button', { class: 'btn big grn mt', onclick: screenFinale }, '🌍 Bekijk jouw impact op de wereld →'));
  box.append(el('div', { class: 'card tight mt' }, el('h3', {}, 'Badges'), el('div', { class: 'badges' }, BADGES.map(b => el('span', { class: 'badge' + (S.badges.includes(b.id) ? '' : ' off'), title: b.d }, el('i', { class: 'd' }), b.t)))));
  box.append(el('div', { class: 'row mt', style: 'justify-content:center' }, el('button', { class: 'btn ghost', onclick: screenStart }, '‹ Naar start'), el('button', { class: 'btn ghost', onclick: restartGame }, '↻ Opnieuw beginnen')));
  show(box);
}
const leaves = n => '🌱'.repeat(Math.round(clamp(n, 0, 5))) || '·';

/* ===== MISSION FRAMEWORK ===== */
const STEPS = [
  { t: 'Briefing', role: 'eng' }, { t: 'Schetsen', role: 'eng' }, { t: 'Ontwerpen & testen', role: 'eng' }, { t: 'Maken', role: 'vak' }, { t: 'Resultaat', role: 'eng' }
];

function sketchPad(m, onChange) {

  wrap.append(bg, fg);

  let color = COLORS[0], size = 4, eraser = false, strokes = 0, hist = [];

  const bx = bg.getContext('2d'), fx = fg.getContext('2d');

  bx.strokeStyle = '#e9e9f3'; bx.lineWidth = 1; for (let x = 0; x <= W; x += 40) { bx.beginPath(); bx.moveTo(x, 0); bx.lineTo(x, H); bx.stroke(); } for (let y = 0; y <= H; y += 40) { bx.beginPath(); bx.moveTo(0, y); bx.lineTo(W, y); bx.stroke(); }

  fg.addEventListener('pointerdown', e => { e.preventDefault(); fg.setPointerCapture(e.pointerId); hist.push(fx.getImageData(0, 0, W, H)); if (hist.length > 20) hist.shift(); drawing = true; last = pos(e); dot(last); });

  const up = () => { drawing = false; onChange(strokes); }; fg.addEventListener('pointerup', up); fg.addEventListener('pointercancel', up);

  function dot(p) { stroke(); fx.beginPath(); fx.arc(p[0], p[1], fx.lineWidth / 2, 0, 7); fx.fill(); }
  function line(a, b) { stroke(); fx.beginPath(); fx.moveTo(a[0], a[1]); fx.lineTo(b[0], b[1]); fx.stroke(); }
  const tools = el('div', { class: 'tools' });

    sw.append(el('button', { class: 'tb' + (size === 4 ? ' on' : ''), onclick: () => { size = 4; drawTools(); } }, 'dun'));
    sw.append(el('button', { class: 'tb' + (size === 10 ? ' on' : ''), onclick: () => { size = 10; drawTools(); } }, 'dik'));
    sw.append(el('button', { class: 'tb', onclick: () => { const h = hist.pop(); if (h) fx.putImageData(h, 0, 0); } }, '↶ Ongedaan'));
    sw.append(el('button', { class: 'tb', onclick: () => { hist.push(fx.getImageData(0, 0, W, H)); fx.clearRect(0, 0, W, H); } }, '✕ Wis'));
  };
  drawTools(); tools.append(sw);
  const api = {
    node: el('div', {}, wrap, tools),
    export() { const c = document.createElement('canvas'); c.width = W / 2; c.height = H / 2; const x = c.getContext('2d'); x.drawImage(bg, 0, 0, W / 2, H / 2); x.drawImage(fg, 0, 0, W / 2, H / 2); return c.toDataURL('image/jpeg', .7); },

}

/* ---- maken: vakmens mini-game + telefoontje + wie doet wat ---- */
function mMake(run) {

  const box = el('div', { class: 'screen' }, missionHeader(run, 3));

  const card = el('div', { class: 'card' }); box.append(card);
  const title = el('h3', {}, M.rounds[0].t);
  const meter = el('div', { class: 'meter' }); const zone = el('div', { class: 'zone' }); const needle = el('div', { class: 'needle' }); meter.append(zone, needle);
  const info = el('p', { class: 'mut' }, M.action);
  const stopBtn = el('button', { class: 'btn big org', onclick: stop }, '⏺ ' + M.verb);
  const res = el('div', { class: 'row', style: 'gap:6px;margin-top:8px' });
  card.append(el('div', { class: 'row between' }, el('span', { class: 'tag vak' }, '🔧 ' + M.who), el('span', { class: 'mut' }, 'ronde 1/3')), title, meter, info, stopBtn, res);
  let round = 0, t0 = performance.now(), raf, running = true, hits = 0;
  const speeds = [1.4, 1.9, 2.5], widths = [26, 20, 15];

  setZone();
  function loop(t) { const p = (Math.sin((t - t0) / 1000 * speeds[round]) + 1) / 2 * 100; needle.style.left = p + '%'; needle.dataset.p = p; if (running) raf = requestAnimationFrame(loop); }
  raf = requestAnimationFrame(loop);
  function stop() {
    if (!running) return; running = false; cancelAnimationFrame(raf);
    const p = +needle.dataset.p; const hit = p >= zoneL && p <= zoneL + zoneW; const near = Math.abs(p - (zoneL + zoneW / 2)) < zoneW;
    if (hit) { hits++; Snd.ok(); needle.classList.add('hit'); } else { Snd.bad(); needle.classList.add('miss'); }
    res.append(el('span', { class: 'tag ' + (hit ? 'ok' : 'bad') }, (hit ? '✓ ' : '✗ ') + M.rounds[round].t));
    info.innerHTML = hit ? `<b style="color:var(--grn)">Strak!</b> ${M.rounds[round].ok}` : `<b style="color:var(--red)">Net niet.</b> ${near ? 'Bijna — vakmanschap is oefening.' : M.rounds[round].miss}`;

      else finish();
    }, 1100);
  }

    card.append(el('div', { class: 'fb ' + (hits >= 2 ? 'ok' : 'info'), html: `<b>${hits}/3 goed.</b> Dat was <b>techniek</b>: precisie, handen, machines, oefening. ${M.outro}` }));
    card.append(el('div', { class: 'vs mt' },

        <text x="${480 + 20}" y="100" fill="${now.imp > now.exp ? '#dd1c50' : '#138273'}" font-size="10" font-weight="700">${now.imp > now.exp ? 'koopt ' + fmt(now.imp) + ' kW' : 'levert ' + fmt(now.exp) + ' kW'}</text>
        <rect x="0" y="252" width="600" height="48" fill="rgba(255,255,255,.85)"/>
        <text x="16" y="270" fill="#5f5b86" font-size="11">CO₂ per jaar nu</text><rect x="120" y="261" width="200" height="10" fill="#dd1c50" opacity=".5"/>
        <text x="16" y="291" fill="#5f5b86" font-size="11">CO₂ per jaar straks</text><rect x="120" y="282" width="${co2w}" height="10" fill="${r.red >= 80 ? '#138273' : '#ffc915'}"/><text x="${130 + co2w}" y="291" fill="${r.red >= 80 ? '#138273' : '#8a6a00'}" font-size="11" font-weight="800">−${fmt(clamp(r.red, 0, 100))}%</text>
        <text x="420" y="280" fill="${r.comfort ? '#138273' : '#dd1c50'}" font-size="11" font-weight="700">${r.comfort ? '🌡 hal wordt warm' : '🥶 hal blijft koud'}</text>
      </svg>`;
      clockLbl.textContent = `${String(Math.floor(hr)).padStart(2, '0')}:${hr % 1 ? '30' : '00'}`;
      clockInfo.innerHTML = `Nu: zon <b>${fmt(now.sK)} kW</b> · verbruik <b>${fmt(now.dK)} kW</b>` + (st.bat ? ` · accu ${Math.round(now.soc * 100)}%` : '');
      mets.innerHTML = '';
      mets.append(metric('CO₂-reductie', `${fmt(clamp(r.red, 0, 100))}%`, 'doel ≥ 80%', r.red >= 80 ? 'ok' : 'bad'), metric('Investering', `€ ${fmt(r.cost)}k`, `budget € ${BUDGET}k`, r.cost <= BUDGET ? 'ok' : 'bad'), metric('Energierekening', `€ ${fmt(r.bill * 1000)}`, `was € ${fmt(r.baseBill * 1000)} per jaar`, r.bill < r.baseBill * .4 ? 'ok' : ''), metric('🌱 Duurzaam', leaves(ecoOf(r)), `terugverdiend in ${r.payback > 50 ? '–' : fmt(r.payback)} jaar`, ecoOf(r) >= 4 ? 'ok' : ecoOf(r) >= 2 ? 'warn' : 'bad'));
      ctx.live([r.red >= 80, r.cost <= BUDGET, r.comfort]);
      return r;
    }
    const clockLbl = el('b', {}, '13:00'); const clockInfo = el('small', { class: 'mut' }, '');
    const clockRange = el('input', { type: 'range', min: 0, max: 23.5, step: .5, value: hr });
    clockRange.addEventListener('input', () => { hr = +clockRange.value; playing = false; playBtn.textContent = '▶'; draw(); });
    const playBtn = el('button', { class: 'tb', onclick: () => { playing = !playing; playBtn.textContent = playing ? '❚❚' : '▶'; if (playing) tick(); } }, '▶');
    function tick() { if (!playing || !document.body.contains(host)) return; hr = (hr + .5) % 24; clockRange.value = hr; draw(); setTimeout(tick, 220); }
    const clock = el('div', { class: 'card tight' }, el('div', { class: 'clock' }, playBtn, el('span', { class: 'mut', style: 'font-size:.8rem;white-space:nowrap' }, '🕒 tijd'), clockRange, clockLbl), clockInfo);
    function test() {
      const r = draw(); Snd.click();
      const okR = r.red >= 80, okC = r.cost <= BUDGET, okW = r.comfort; const pass = okR && okC && okW;
      let score = Math.round(25 * clamp(r.red / 80, 0, 1)) + (okC ? 10 : 4) + (okW ? 5 : 0);
      if (pass) score += r.payback <= 10 ? 10 : r.payback <= 14 ? 6 : 3; score = clamp(score, 0, 50);
      const msgs = [];
      if (!okW) msgs.push('<b>Brrr.</b> Een warmtepomp werkt op lage temperatuur; in een ongeïsoleerde hal krijgt hij het niet warm. Isoleer eerst, dan pas de warmtepomp.');
      if (!okR) msgs.push(`CO₂-reductie <b>${fmt(clamp(r.red, 0, 100))}%</b> — nog geen 80%.` + (!st.wp ? ' Zolang de gasketel brandt, kom je er niet.' : r.exp > r.direct ? ' Je levert veel zonnestroom terug zonder hem te gebruiken — een batterij helpt.' : ' Meer panelen, betere isolatie of opslag?'));
      if (!okC) msgs.push(`€ ${fmt(r.cost)}k is over het budget. Welke maatregel levert het minste op per euro?`);
      if (pass) msgs.push(`<b>Van het gas af!</b> −${fmt(r.red)}% CO₂ voor € ${fmt(r.cost)}k. De energierekening daalt van € ${fmt(r.baseBill * 1000)} naar € ${fmt(r.bill * 1000)} per jaar — terugverdiend in ${fmt(r.payback)} jaar.`);
      fb.className = 'fb ' + (pass ? 'ok' : 'bad'); fb.innerHTML = msgs.join('<br>');
      detail.classList.remove('hidden'); detail.innerHTML = '';
      [['Warmtevraag na isolatie', `${fmt(r.heat)} MWh`], ['Stroomverbruik (incl. warmtepomp)', `${fmt(r.demand)} MWh`], ['Zonnestroom opgewekt', `${fmt(r.solar)} MWh`], ['…direct gebruikt', `${fmt(r.direct)} MWh`], ['…teruggeleverd aan het net', `${fmt(r.exp)} MWh`], ['Van het net gekocht', `${fmt(r.imp)} MWh`], ['CO₂ per jaar', `${fmt(r.co2, 1)} ton (was ${fmt(r.base)})`]].forEach(([k, v]) => detail.append(el('div', { class: 'kv' }, el('span', { class: 'mut' }, k), el('b', {}, v))));
      const ecoNote = r.red >= 90 ? 'Van 42 ton CO₂ per jaar naar bijna niets: isolatie eerst, dan warmtepomp, dan zon. Zo doe je dat.' : st.iso >= 2 ? 'Isoleren is de slimste eerste stap: warmte die je niet verliest, hoef je niet op te wekken.' : 'De beste energie is de energie die je niet gebruikt. Isolatie levert vaak meer op dan extra panelen.';
      ctx.report({ pass, score, eco: ecoOf(r), ecoNote, red: r.red, cost: r.cost, co2: r.co2, base: r.base, payback: r.payback });
    }
    const ctl = el('div', { class: 'card' },
      slider('Zonnepanelen (€ 450 per stuk)', 0, 200, 10, st.pv, v => `${v} stuks`, v => { st.pv = v; draw(); }),
      slider('Batterijopslag (€ 600 per kWh)', 0, 100, 5, st.bat, v => `${v} kWh`, v => { st.bat = v; draw(); }),
      el('div', { class: 'ctl' }, el('label', {}, el('span', {}, 'Isolatie')), seg(ISO.map((o, i) => ({ v: i, t: `${o.t}${o.c ? ' · €' + o.c + 'k' : ''}` })), st.iso, v => { st.iso = v; draw(); })),
      toggle('Warmtepomp i.p.v. gasketel', '€ 60.000 · werkt alleen goed in een geïsoleerd gebouw', st.wp, v => { st.wp = v; draw(); }),
      toggle('LED-verlichting in de hal', '€ 15.000 · bespaart 12 MWh stroom per jaar', st.led, v => { st.led = v; draw(); }),
      el('button', { class: 'btn big org mt', onclick: test }, '📊 Doorrekenen (1 jaar)'));
    host.append(viz, clock, mets, fb, detail, ctl);
    draw();
  },
  maak: {
    who: 'Fatima de installateur', intro: 'De panelen moeten op het dak en de warmtepomp moet aangesloten. Precies waterpas, precies de juiste druk.',
    action: 'Stop de naald in het groene vlak.', verb: 'Monteren',
    rounds: [{ t: 'Panelen waterpas leggen', ok: 'Kaarsrecht. Maximale opbrengst.', miss: 'Scheef: minder zon én lekkage-risico.' }, { t: 'Leidingdruk warmtepomp', ok: 'Druk staat perfect.', miss: 'Te hoge druk: het veiligheidsventiel blaast af.' }, { t: 'Omvormer aansluiten', ok: 'Groen lampje. Er stroomt zonnestroom.', miss: 'Fase verwisseld: de omvormer schakelt uit.' }],
    outro: 'Fatima werkt met 400 volt op een dak van 8 meter hoog. Vakmanschap én veiligheid, elke dag.',
    engDid: ['Schetste het plan', 'Rekende CO₂, kosten en opbrengst door', 'Koos de combinatie van maatregelen'],
    vakDid: ['Legt de panelen en trekt de kabels', 'Installeert de warmtepomp', 'Ziet op het dak wat de tekening mist']

  handover: {

      { t: 'Leg ze maar op de noordkant, dan klopt het aantal tenminste.', good: false, fb: 'Het aantal klopt, maar de opbrengst niet — en dus ook je CO₂-berekening niet. Een engineer denkt in resultaat, niet in aantallen.' },
      { t: 'Zaag die lichtkoepel er maar uit.', good: false, half: true, fb: 'Dan heeft de sportzaal geen daglicht meer en meer verlichtingskosten. Eerst rekenen, dan beslissen.' },
